[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satsimp"
version = "0.1.0"
description = "SymPy's refine() as rule tables, on the satassume ask engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
# satassume pinned to a commit of its main, so outputs are reproducible; the nightly
# .github/workflows/satassume-bump.yml moves it (docs/refine-testing.md, "The satassume pin")
dependencies = [
    "satassume @ git+https://github.com/tilorc-bot/satassume@5a7d3b8d9e8e1a8d28a1f05892ff581ab4446bc9",
    "sympy>=1.12",
    "mpmath",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "hypothesis", "z3-solver"]

[tool.setuptools.packages.find]
# satrefine: the deprecated alias of the package's old name (one module, re-exporting refine)
include = ["satsimp*", "satrefine"]
# offline parts (table generation, tools, test fixtures) and refine's reference handlers
# (satsimp.methods.refine.reference, selected as handlers_v3) are dev-only
exclude = ["satsimp.build*", "satsimp.tools*", "satsimp.testing*", "satsimp.methods.refine.reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
