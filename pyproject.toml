[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satsimp"
version = "0.1.0"
description = "SymPy's refine() as rule tables, on the satassume ask engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
# satassume pinned to a commit of its main, so outputs are reproducible; the nightly
# .github/workflows/satassume-bump.yml moves it (docs/refine-testing.md, "The satassume pin")
dependencies = [
    "satassume @ git+https://github.com/tilorc-bot/satassume@92f4bf4b7726c5c34e7d16ce92325b701da3d42a",
    "sympy>=1.12",
    "mpmath",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "hypothesis", "z3-solver"]

[tool.setuptools.packages.find]
# satrefine: the deprecated alias of the package's old name (one module, re-exporting refine)
include = ["satsimp*", "satrefine"]
# offline parts (table generation, tools, test fixtures) and refine's reference handlers
# (satsimp.methods.refine.reference, selected as handlers_v3) are dev-only
exclude = ["satsimp.build*", "satsimp.tools*", "satsimp.testing*", "satsimp.methods.refine.reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The SymPy boundary (README, "SymPy boundary"): the shipped package must not reach
# SymPy's simplification or its assumption reasoning.  CI runs only this rule
# (`ruff check --select TID251 satsimp satrefine`; ruff's default rules report unrelated
# findings); tools/check_sympy_boundary.py covers the method calls an import ban cannot
# see.  A banned module bans its submodules; `from sympy import simplify` and
# `sympy.simplify(...)` resolve to the same name.  The backend that deliberately offers
# SymPy's `ask` (satsimp/engine/backend.py) marks those imports with `# noqa: TID251`.
[tool.ruff.lint.per-file-ignores]
# oracles, recorders and fixtures that compare against SymPy; not packaged
"tests/**" = ["TID251"]
"tools/**" = ["TID251"]
"satsimp/tools/**" = ["TID251"]
"satsimp/testing/**" = ["TID251"]
"satsimp/build/**" = ["TID251"]
# the reference handlers (handlers_v3, dev-only, not packaged)
"satsimp/methods/refine/reference/**" = ["TID251"]

