name: tests
on: [push, pull_request]
jobs:
  test:
    name: test (Python ${{ matrix.python }}, ${{ matrix.sympy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        # the baseline: SymPy at the commit the refine gates use (satsimp/tools/refine_gates.sh);
        # the refine tests need its assumptions/refine changes
        sympy: ["sympy @ git+https://github.com/tilorc-bot/sympy@6379c4da69"]
        include:
          # released SymPy: refine must work on it; what needs the newer SymPy is a strict
          # xfail or a left-out case there (a feature check, not the version)
          - python: "3.12"
            sympy: "sympy==1.14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pip install "${{ matrix.sympy }}"
      - run: python -c "import sympy, mpmath; print('sympy', sympy.__version__, 'mpmath', mpmath.__version__)"
      # one run per tree: the trees share test module basenames; tests/refine_identities/needs
      # holds open requests (expected to fail) and is left out
      - run: python -m pytest -q -n auto tests/refine_identities --ignore=tests/refine_identities/needs
        env: {PYTHONHASHSEED: "0"}
      - run: python -m pytest -q -n auto tests/refine
        if: always()
        env: {PYTHONHASHSEED: "0"}
      - run: python -m pytest -q -n auto tests/refine_v3
        if: always()
        env: {PYTHONHASHSEED: "0"}
